apiVersion: v1
kind: Service
metadata:
  name: target-sim
  namespace: vespera-dev
spec:
  ports:
    - port: 8000
  clusterIP: None
  selector:
    app: target-sim

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: target-sim
  namespace: vespera-dev
spec:
  selector:
    matchLabels:
      app: target-sim
  serviceName: "target-sim"
  replicas: 3
  template:
    metadata:
      labels:
        app: target-sim
    spec:
      containers:
        - name: target-sim
          image: vespera:e7b922c
          command: ["uvicorn", "vespera.targetsim.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: targetsim-port
