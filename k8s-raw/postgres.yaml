apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vespera-dev
spec:
  ports:
    - port: 5432
  clusterIP: None
  selector:
    app: postgres

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vespera-dev
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: "postgres"
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres-port
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
          env:
            - name: POSTGRES_USER
              value: "vespera"
            - name: POSTGRES_DB
              value: "vespera"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
