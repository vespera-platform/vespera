apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checker
  namespace: vespera-dev
  labels:
    app: checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checker
  template:
    metadata:
      labels:
        app: checker
    spec:
      containers:
        - name: checker-cont
          image: vespera:e7b922c
          command: ["python", "-m", "vespera.checker.main"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://vespera:$(DB_PASSWORD)@postgres:5432/vespera
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SHARD_COUNT
              value: "2"
            - name: WEBHOOK_URL
              value: http://target-sim:8000/hook
