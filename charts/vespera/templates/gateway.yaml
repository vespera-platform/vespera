apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vespera-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: http
      protocol: HTTP
      port: 80

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: vespera-gateway
  hostnames:
    - {{ required "api.host jest wymagane - podaj -f values-<env>.yaml" .Values.api.host | quote }}
  rules:
    - backendRefs:
      - name: api
        port: 80
      - name: api-canary
        port: 80