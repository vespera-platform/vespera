apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: vespera-gateway
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: vespera-tls
    {{- end }}

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: vespera-gateway
  hostnames:
    - {{ required "api.host jest wymagane - podaj -f values-<env>.yaml" .Values.api.host | quote }}
  rules:
    - backendRefs:
      - name: api
        port: 80
      - name: api-canary
        port: 80