{{- if .Values.postDeployTest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: postdeploy
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app: postdeploy
    spec:
      restartPolicy: Never
      serviceAccountName: postdeploy
      containers:
        - name: postdeploy
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["python", "-m", "vespera.postdeploy"]
          env:
            - name: POSTDEPLOY_BASE_URL
              value: http://api
            - name: POSTDEPLOY_TARGET_URL
              value: http://target-sim:8000/
            - name: POSTDEPLOY_EXPECTED_VERSION
              value: {{ .Values.image.tag | quote }}
          securityContext:
            {{- include "vespera.securityContext" . | nindent 12 }}
{{- end }}