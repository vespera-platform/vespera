apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vespera-db
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "externalSecret.store jest wymagane: nazwa ClusterSecretStore (dev: eso-local)" .Values.externalSecret.store }}
  data:
    - secretKey: password
      remoteRef:
       key: {{ required "externalSecret.remoteKey jest wymagane: nazwa sekretu w magazynie" .Values.externalSecret.remoteKey }}
       property: password