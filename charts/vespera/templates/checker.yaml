apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checker
  namespace: {{ .Release.Namespace }}
  labels:
    app: checker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checker
  template:
    metadata:
      labels:
        app: checker
    spec:
      containers:
        - name: checker-cont
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["python", "-m", "vespera.checker.main"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://vespera:$(DB_PASSWORD)@postgres:5432/vespera
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SHARD_COUNT
              value: "2"
            - name: WEBHOOK_URL
              value: http://target-sim:8000/hook
          securityContext:
            {{- include "vespera.securityContext" . | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: { }
