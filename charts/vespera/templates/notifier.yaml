apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: {{ .Release.Namespace }}
  labels:
    app: notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
    spec:
      containers:
        - name: notifier-cont
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["python", "-m", "vespera.notifier.main"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://vespera:$(DB_PASSWORD)@postgres:5432/vespera
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WEBHOOK_URL
              value: http://target-sim:8000/hook
