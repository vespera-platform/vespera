apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api-container
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              port: 8000
              path: /healthz
          readinessProbe:
            httpGet:
              port: 8000
              path: /readyz
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://vespera:$(DB_PASSWORD)@postgres:5432/vespera
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WEBHOOK_URL
              value: http://target-sim:8000/hook
            - name: FAULT_ERROR_RATE
              value: {{ .Values.api.faultErrorRate | quote }}
          securityContext:
            {{- include "vespera.securityContext" . | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      serviceAccountName: api
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      stableService: api
      canaryService: api-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: api
            namespace: {{ .Release.Namespace }}
      steps:
        - setWeight: 10
        - pause: { }
        - setWeight: 50
        - pause: { }

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: api

---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: api
