{{- $s := .Values.api.rollout.strategy | default "canary" }}
{{- if not (has $s (list "canary" "rolling" "blueGreen")) }}
{{- fail (printf "api.rollout.strategy: nieznana wartość %q (canary|rolling|blueGreen)" $s) }}
{{- end }}
{{- if eq $s "rolling" }}
apiVersion: apps/v1
kind: Deployment
{{- else }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- end }}
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api-container
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              port: 8000
              path: /healthz
          readinessProbe:
            httpGet:
              port: 8000
              path: /readyz
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://vespera:$(DB_PASSWORD)@postgres:5432/vespera
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WEBHOOK_URL
              value: http://target-sim:8000/hook
            - name: FAULT_ERROR_RATE
              value: {{ .Values.api.faultErrorRate | quote }}
          securityContext:
            {{- include "vespera.securityContext" . | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      serviceAccountName: api
      volumes:
        - name: tmp
          emptyDir: {}
  {{- if eq $s "rolling" }}
  strategy:
    type: RollingUpdate
  {{- else if eq $s "blueGreen" }}
  strategy:
    blueGreen:
      activeService: api
      previewService: api-canary
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 180
      {{- if .Values.api.rollout.analysis }}
      postPromotionAnalysis:
        templates:
          - templateName: api-error-rate
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      {{- end }}
  {{- else }}
  strategy:
    canary:
      stableService: api
      canaryService: api-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: api
            namespace: {{ .Release.Namespace }}
      steps:
        - setWeight: 10
        {{- if .Values.api.rollout.analysis }}
        - analysis:
            templates:
              - templateName: api-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- end }}
        - setWeight: 50
        {{- if .Values.api.rollout.analysis }}
        - analysis:
            templates:
              - templateName: api-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        {{- end }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: api
{{- if ne $s "rolling" }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: api
{{- end }}