apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api-container
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              port: 8000
              path: /healthz
          readinessProbe:
            httpGet:
              port: 8000
              path: /readyz
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://vespera:$(DB_PASSWORD)@postgres:5432/vespera
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WEBHOOK_URL
              value: http://target-sim:8000/hook
          securityContext:
            {{- include "vespera.securityContext" . | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: api