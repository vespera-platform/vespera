apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api-container
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              port: 8000
              path: /healthz
          readinessProbe:
            httpGet:
              port: 8000
              path: /readyz
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vespera-db
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://vespera:$(DB_PASSWORD)@postgres:5432/vespera
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WEBHOOK_URL
              value: http://target-sim:8000/hook

---

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  selector:
    app: api