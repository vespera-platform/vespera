apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress, Ingress]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Egress, Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ required "networkPolicy.gatewayCIDR jest wymagane: podsieć, z której Gateway łączy się z api (kind: sieć Dockera 'kind')" .Values.networkPolicy.gatewayCIDR }}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: migrate
        - podSelector:
            matchLabels:
              app: checker
      ports:
        - port: 5432
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: checker
        - podSelector:
            matchLabels:
              app: notifier
      ports:
        - port: 6379
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: target-sim
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: target-sim
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: checker
        - podSelector:
            matchLabels:
              app: notifier
      ports:
        - port: 8000
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: migrate
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notifier
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: notifier
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: target-sim
      ports:
        - port: 8000
          protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checker
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: checker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: target-sim
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range (required "networkPolicy.clusterCIDRs jest wymagane: sieci klastra wyłączone z egress checkera do internetu" .Values.networkPolicy.clusterCIDRs) }}
              - {{ . }}
              {{- end }}
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP