apiVersion: v1
kind: Service
metadata:
  name: target-sim
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 8000
  clusterIP: None
  selector:
    app: target-sim

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: target-sim
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: target-sim
  serviceName: "target-sim"
  replicas: 3
  template:
    metadata:
      labels:
        app: target-sim
    spec:
      containers:
        - name: target-sim
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["uvicorn", "vespera.targetsim.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: targetsim-port
          securityContext:
                {{- include "vespera.securityContext" . | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      serviceAccountName: target-sim
      volumes:
        - name: tmp
          emptyDir: { }