version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/"
    groups:
      python:
        patterns:
          - "*"
    schedule:
      interval: "weekly"