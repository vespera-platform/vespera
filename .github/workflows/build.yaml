name: Build
on:
  push:
    branches:
      - main
jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/vespera-platform/vespera:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}

      - name: run Trivy scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ghcr.io/vespera-platform/vespera:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: 1

      - name: push
        run: docker push ghcr.io/vespera-platform/vespera:${{ github.sha }}

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: digest
        id: digest
        run: echo "ref=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/vespera-platform/vespera:${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: sign
        run: cosign sign --yes ${{ steps.digest.outputs.ref }}

      - name: sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.digest.outputs.ref }}
          format: 'cyclonedx-json'
          output-file: sbom.cdx.json

      - name: attest sbom
        run: cosign attest --yes --type='cyclonedx' --predicate sbom.cdx.json ${{ steps.digest.outputs.ref }}


  promote:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: token App
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: vespera-platform
          repositories: vespera-gitops

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vespera-platform/vespera-gitops
          token: ${{ steps.app-token.outputs.token }}

      - name: tag/commit/merge
        run: |
          git config user.name "vespera-ci-bot[bot]"
          git config user.email "vespera-ci-bot[bot]@users.noreply.github.com"
          git switch -c bump/dev-${{ github.sha }}
          yq -i '.image.tag = "${{ github.sha }}"' envs/dev/values.yaml
          git commit -am "ci: dev -> ${{ github.sha }}"
          git push -u origin HEAD
          gh pr create --fill
          gh pr merge --squash --delete-branch

        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token}}
