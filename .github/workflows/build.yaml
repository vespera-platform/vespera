name: Build
on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: buildx
        uses: docker/setup-buildx-action@v4

      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/vespera-platform/vespera:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}

      - name: run Trivy scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ghcr.io/vespera-platform/vespera:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: 1

      - name: push
        run: docker push ghcr.io/vespera-platform/vespera:${{ github.sha }}

  promote:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: token App
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: vespera-platform
          repositories: vespera-gitops

      - name: checkout
        uses: actions/checkout@v7
        with:
          repository: vespera-platform/vespera-gitops
          token: ${{ steps.app-token.outputs.token }}

      - name: tag/commit/merge
        run: |
          git config user.name "vespera-ci-bot[bot]"
          git config user.email "vespera-ci-bot[bot]@users.noreply.github.com"
          git switch -c bump/dev-${{ github.sha }}
          yq -i '.image.tag = "${{ github.sha }}"' envs/dev/values.yaml
          git commit -am "ci: dev -> ${{ github.sha }}"
          git push -u origin HEAD
          gh pr create --fill
          gh pr merge --squash --delete-branch

        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token}}
